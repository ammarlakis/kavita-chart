name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate Renovate config JSON
        run: python3 -m json.tool renovate.json >/dev/null

      - name: Validate values schema JSON
        run: python3 -m json.tool charts/kavita/values.schema.json >/dev/null

      - name: Check release script syntax
        run: bash -n scripts/release.sh

      - name: Lint chart
        run: helm lint charts/kavita

      - name: Render chart
        run: helm template kavita charts/kavita >/dev/null

      - name: Package Helm chart
        run: helm package charts/kavita --destination dist
